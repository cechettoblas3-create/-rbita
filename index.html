<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Órbita</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f0e0d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Concepto: app de una columna, de noche. Balance arriba, ingresos y gastos en dos columnas, cuentas propias con foto. */
:root {
  color-scheme: dark;
  --bg: #0f0e0d;
  --surface: #191715;
  --surface-2: #231f1c;
  --line: #322d28;
  --fg: #f5efe8;
  --muted: #a1978c;
  --accent: #ff7a1a;
  --accent-ink: #1c0d02;
  --pos: #5bd694;
  --neg: #ff6378;
  --warn: #ffc247;
  --save: #b48cff;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
/* Sin zoom: ni pellizco ni doble toque. Solo se permite desplazar. */
html, body, * { touch-action: pan-x pan-y; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
  padding-block: 12px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
input, select { font: inherit; font-size: 16px; color: var(--fg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }

#app { max-width: 520px; margin: 0 auto; padding-bottom: 120px; }

/* Cabecera de mes */
.brand { display: flex; align-items: center; gap: 10px; margin: 2px 0 14px; }
.eye { margin-left: auto; width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--surface); color: var(--fg); flex: none; }
.eye svg { width: 22px; height: 22px; }
.brand img { width: 36px; height: 36px; border-radius: 10px; display: block; }
.brand b { font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: -0.02em; }
.month { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 16px; }
.month h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -0.01em; }
.month button { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--surface); color: var(--fg); }
.month svg { width: 20px; height: 20px; }

/* Balance */
.hero {
  border-radius: 24px;
  padding: 22px 20px 18px;
  background:
    radial-gradient(120% 100% at 100% 0%, color-mix(in srgb, var(--accent) 26%, transparent), transparent 62%),
    var(--surface);
  border: 1px solid var(--line);
}
.label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.balance { font-family: var(--font-display); font-weight: 800; font-size: clamp(34px, 11vw, 48px); letter-spacing: -0.03em; line-height: 1.05; margin: 6px 0 0; overflow-wrap: anywhere; }
.balance.neg { color: var(--neg); }
.flow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.flow > div { background: color-mix(in srgb, var(--bg) 55%, transparent); border-radius: 16px; padding: 12px 14px; min-width: 0; }
.flow .v { font-family: var(--font-display); font-weight: 700; font-size: 18px; margin-top: 2px; overflow-wrap: anywhere; }
.flow .pos .v { color: var(--pos); }
.flow .neg .v { color: var(--neg); }
.flow .sav { grid-column: 1 / -1; }
.flow .sav .v { color: var(--save); }
.flow .t { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
.flow .t svg { width: 14px; height: 14px; }
.flow .pos .t svg { color: var(--pos); }
.flow .neg .t svg { color: var(--neg); }

h2 { font-family: var(--font-display); font-size: 17px; font-weight: 700; margin: 26px 0 10px; letter-spacing: -0.005em; }
.hint { color: var(--muted); font-size: 13px; margin: 0 0 12px; }

/* Avatares de cuenta */
.av {
  --c: var(--accent);
  width: 40px; height: 40px; border-radius: 13px; flex: none; overflow: hidden;
  display: grid; place-items: center;
  background: color-mix(in srgb, var(--c) 24%, var(--surface-2));
  color: var(--c); font-family: var(--font-display); font-weight: 800; font-size: 17px;
}
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.av.s { width: 28px; height: 28px; border-radius: 9px; font-size: 13px; }
.av.l { width: 76px; height: 76px; border-radius: 24px; font-size: 30px; }

.wallets { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.wal { display: block; width: 100%; text-align: left; background: var(--surface); border-radius: 18px; padding: 12px 14px; min-width: 0; }
.wal:active { background: var(--surface-2); }
.wal .t { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
.wal .v { font-family: var(--font-display); font-weight: 700; font-size: 18px; margin-top: 4px; overflow-wrap: anywhere; }
.wal .v.neg { color: var(--neg); }
.wal.full { grid-column: 1 / -1; }
.mv small .dot { width: 7px; height: 7px; margin-right: 5px; vertical-align: middle; }

.subrow { display: flex; justify-content: space-between; gap: 10px; margin: 6px 0 0 38px; font-size: 13px; color: var(--muted); }
.row.subc { margin-left: 22px; width: calc(100% - 22px); min-height: 52px; }
.to-line { background: var(--surface-2); border-radius: 14px; padding: 12px 14px; font-weight: 600; line-height: 1.35; }

/* Columnas de ingresos y gastos */
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 22px; align-items: start; }
.cols > section { min-width: 0; }
.colh { display: flex; align-items: center; gap: 6px; margin: 0 0 10px; font-family: var(--font-display); font-weight: 700; font-size: 16px; }
.colh svg { width: 16px; height: 16px; }
.colh.pos svg { color: var(--pos); }
.colh.neg svg { color: var(--neg); }
.colh span { margin-left: auto; color: var(--muted); font-family: var(--font-body); font-size: 12px; font-weight: 600; }
.list { display: grid; gap: 8px; }
.mv { display: grid; gap: 4px; width: 100%; min-width: 0; background: var(--surface); border-radius: 16px; padding: 10px; }
.mv:active, .row:active { background: var(--surface-2); }
.mv-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.mv-top b { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mv .amt { font-size: 15px; margin-top: 2px; }
.mv small { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.amt { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.amt.pos { color: var(--pos); }
.amt.neg { color: var(--fg); }
.mini-empty { color: var(--muted); font-size: 13px; padding: 18px 10px; text-align: center; background: var(--surface); border-radius: 16px; }

.row { display: flex; align-items: center; gap: 12px; width: 100%; background: var(--surface-2); border-radius: 16px; padding: 10px 12px; min-height: 60px; }
.rmain { flex: 1; min-width: 0; display: grid; }
.rmain b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rmain small { color: var(--muted); font-size: 13px; }
.chev { width: 18px; height: 18px; color: var(--muted); flex: none; }

.empty { text-align: center; color: var(--muted); padding: 28px 12px; background: var(--surface); border-radius: 16px; }
.note { display: flex; gap: 10px; align-items: center; justify-content: space-between; background: color-mix(in srgb, var(--accent) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); border-radius: 14px; padding: 10px 12px; margin-bottom: 14px; font-size: 13px; }
.link { color: var(--accent); font-weight: 700; white-space: nowrap; padding: 8px 4px; }

/* Tarjetas */
.card { background: var(--surface); border-radius: 18px; padding: 16px; margin-bottom: 10px; width: 100%; display: block; }
.card-top { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-bottom: 10px; }
.card-top b { font-weight: 600; display: flex; align-items: center; gap: 10px; min-width: 0; }
.card-top span { color: var(--muted); font-size: 13px; text-align: right; }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; }
.sub { font-size: 12px; margin-top: 8px; color: var(--muted); }
.sub.bad { color: var(--neg); }
.edit { display: flex; gap: 8px; margin-top: 12px; }
.grp { font-size: 13px; font-weight: 700; color: var(--muted); margin: 16px 0 8px; }

/* Gráfico */
.chart { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; align-items: end; height: 150px; padding-top: 6px; border-bottom: 1px solid var(--line); }
.chart .col { display: flex; gap: 3px; align-items: flex-end; justify-content: center; height: 100%; }
.chart .b { width: 100%; max-width: 16px; border-radius: 6px 6px 2px 2px; min-height: 3px; }
.chart .b.i { background: var(--pos); }
.chart .b.e { background: var(--accent); }
.axis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 6px; text-align: center; font-size: 12px; color: var(--muted); }
.legend { display: flex; gap: 16px; justify-content: center; margin-top: 12px; font-size: 13px; color: var(--muted); }
.legend span { display: flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }

/* Controles */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 44px; padding: 0 16px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
.chip.withav { padding-left: 8px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip.inc[aria-pressed="true"] { background: var(--pos); border-color: var(--pos); }
.chip.add { border-style: dashed; color: var(--accent); background: transparent; }
.field { display: grid; gap: 6px; margin-top: 16px; }
.field > label, .field > .lb { color: var(--muted); font-size: 13px; font-weight: 600; }
.input { width: 100%; min-height: 48px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 0 14px; }
.input.big { min-height: 64px; font-family: var(--font-display); font-weight: 800; font-size: 32px; letter-spacing: -0.02em; }
.btn { min-height: 52px; border-radius: 16px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 16px; display: grid; place-items: center; padding: 0 20px; width: 100%; text-align: center; }
.btn.small { min-height: 48px; width: auto; flex: none; }
.btn.ghost { background: var(--surface-2); color: var(--fg); }
.btn.danger { background: color-mix(in srgb, var(--neg) 18%, var(--surface-2)); color: var(--neg); }
.rate { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.rate b { width: 64px; flex: none; }
.err { color: var(--neg); font-size: 13px; min-height: 18px; margin-top: 10px; }
.sw-row { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { width: 44px; height: 44px; border-radius: 14px; background: var(--c); border: 3px solid transparent; }
.sw[aria-pressed="true"] { border-color: var(--fg); }
.photo { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.photo .btns { display: grid; gap: 8px; }
.photo label.btn { cursor: pointer; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }

/* Menú del + */
.opt { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 68px; background: var(--surface-2); border-radius: 18px; padding: 10px 14px; margin-bottom: 10px; }
.opt .ic { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; flex: none; }
.opt .ic svg { width: 22px; height: 22px; }
.opt b { display: block; font-weight: 700; }
.opt small { color: var(--muted); font-size: 13px; }

/* Barra inferior */
nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  padding: 8px max(10px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
}
nav .in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr 76px 1fr 1fr; align-items: center; }
.tab { display: grid; justify-items: center; gap: 2px; min-height: 52px; align-content: center; color: var(--muted); font-size: 11px; font-weight: 600; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); }
.fab { width: 60px; height: 60px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; margin: -22px auto 0; box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 45%, transparent); }
.fab svg { width: 28px; height: 28px; }

/* Hojas */
.scrim { position: fixed; inset: 0; z-index: 30; background: rgb(0 0 0 / 0.6); display: flex; align-items: flex-end; justify-content: center; }
.scrim.s2 { z-index: 40; }
.sheet {
  width: 100%; max-width: 520px; max-height: 92%; overflow-y: auto;
  background: var(--surface); border-radius: 26px 26px 0 0; border: 1px solid var(--line); border-bottom: 0;
  padding: 18px max(18px, env(safe-area-inset-left, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-right, 0px));
  animation: up .22s ease-out;
}
.sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.sheet-head h3 { margin: 0; font-family: var(--font-display); font-size: 20px; }
.sheet-head button { width: 44px; height: 44px; border-radius: 14px; background: var(--surface-2); display: grid; place-items: center; }
.sheet-head svg { width: 18px; height: 18px; }
@keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
</style>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Órbita">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head><body>

<div id="app"></div>

<nav aria-label="Secciones">
  <div class="in">
    <button class="tab" data-act="tab" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Inicio</button>
    <button class="tab" data-act="tab" data-tab="budgets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12l5-5"/></svg>Presupuesto</button>
    <button class="fab" data-act="add" aria-label="Agregar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tab" data-act="tab" data-tab="summary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Resumen</button>
    <button class="tab" data-act="tab" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Ajustes</button>
  </div>
</nav>

<!-- Menú del + -->
<div class="scrim" id="scrim-menu" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mn-title">
    <div class="sheet-head">
      <h3 id="mn-title">¿Qué querés agregar?</h3>
      <button data-act="close-menu" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <button class="opt" data-act="menu-e"><span class="ic" style="background:color-mix(in srgb,var(--neg) 20%,var(--surface));color:var(--neg)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg></span><span><b>Nuevo gasto</b><small>Plata que sale</small></span></button>
    <button class="opt" data-act="menu-i"><span class="ic" style="background:color-mix(in srgb,var(--pos) 20%,var(--surface));color:var(--pos)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></span><span><b>Nuevo ingreso</b><small>Plata que entra</small></span></button>
    <button class="opt" data-act="menu-t"><span class="ic" style="background:color-mix(in srgb,#3ab4ff 20%,var(--surface));color:#3ab4ff"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h12l-3-3M17 17H5l3 3"/></svg></span><span><b>Pasar plata entre cuentas</b><small>Entre tus cuentas</small></span></button>
    <button class="opt" data-act="menu-wal"><span class="ic" style="background:color-mix(in srgb,#4cc9d8 20%,var(--surface));color:#4cc9d8"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-6 9 6M5 10v8M9 10v8M15 10v8M19 10v8M3 20h18"/></svg></span><span><b>Nueva cuenta</b><small>Un banco, una billetera o lo que uses</small></span></button>
    <button class="opt" data-act="menu-acc"><span class="ic" style="background:color-mix(in srgb,var(--accent) 20%,var(--surface));color:var(--accent)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 11h18M16 15h2"/></svg></span><span><b>Nueva categoría</b><small>Creá tus propias categorías, con foto</small></span></button>
  </div>
</div>

<!-- Movimiento -->
<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title">
    <div class="sheet-head">
      <h3 id="sh-title">Nuevo movimiento</h3>
      <button data-act="close" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="chips" id="sh-type"></div>
    <div class="field"><label for="sh-amt">Monto</label><input class="input big num" id="sh-amt" inputmode="decimal" autocomplete="off" placeholder="0,00"></div>
    <div class="field"><span class="lb">Moneda</span><div class="chips" id="sh-cur"></div></div>
    <div class="field"><span class="lb" id="lb-wal">Cuenta</span><div class="chips" id="sh-wal"></div></div>
    <div class="field" id="f-to" hidden><span class="lb">Hacia</span><div class="chips" id="sh-to"></div><div class="hint" style="margin:6px 0 0">No cuenta como gasto ni como ingreso.</div></div>
    <div class="field" id="f-cat"><span class="lb">Categoría</span><div class="chips" id="sh-cat"></div></div>
    <div class="field" id="f-sub" hidden><span class="lb">Subcategoría (opcional)</span><div class="chips" id="sh-sub"></div></div>
    <div class="field"><label for="sh-date">Fecha</label><input class="input" id="sh-date" type="date"></div>
    <div class="field"><label for="sh-note">Nota (opcional)</label><input class="input" id="sh-note" autocomplete="off" placeholder="Ej: supermercado" maxlength="60"></div>
    <div class="err" id="sh-err" role="alert"></div>
    <div style="display:grid;gap:10px;margin-top:6px">
      <button class="btn" data-act="save">Guardar</button>
      <button class="btn danger" data-act="del" id="sh-del" hidden>Eliminar</button>
    </div>
  </div>
</div>

<!-- Cuenta -->
<div class="scrim s2" id="scrim-acc" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ac-title">
    <div class="sheet-head">
      <h3 id="ac-title">Nueva categoría</h3>
      <button data-act="close-acc" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="chips" id="ac-kind"></div>
    <div class="field"><label for="ac-name">Nombre</label><input class="input" id="ac-name" autocomplete="off" maxlength="24" placeholder="Ej: Salidas con amigos"></div>
    <div class="field" id="ac-pf" hidden><span class="lb">Dentro de</span><div class="chips" id="ac-par"></div></div>
    <div class="field" id="ac-balf" hidden><label for="ac-bal">¿Cuánto tenés ahí hoy? (opcional)</label><input class="input num" id="ac-bal" inputmode="decimal" autocomplete="off" placeholder="0,00"></div>
    <div class="field"><span class="lb">Foto</span>
      <div class="photo">
        <span id="ac-prev"></span>
        <div class="btns">
          <label class="btn ghost small" for="ac-file">Elegir foto</label>
          <input class="vh" type="file" accept="image/*" id="ac-file">
          <button class="link" data-act="ac-nophoto" id="ac-nophoto" hidden style="text-align:left">Quitar foto</button>
        </div>
      </div>
    </div>
    <div class="field"><span class="lb">Color</span><div class="sw-row" id="ac-col"></div></div>
    <div class="err" id="ac-err" role="alert"></div>
    <div style="display:grid;gap:10px;margin-top:6px">
      <button class="btn" data-act="ac-save" id="ac-savebtn">Guardar categoría</button>
      <button class="btn danger" data-act="ac-del" id="ac-del" hidden>Eliminar categoría</button>
    </div>
  </div>
</div>

<!-- Ajuste de saldo -->
<div class="scrim" id="scrim-adj" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="aj-title">
    <div class="sheet-head">
      <h3 id="aj-title">Ajustar saldo</h3>
      <button data-act="close-adj" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="to-line" id="aj-cur"></div>
    <div class="field"><label for="aj-amt">¿Cuánto tenés realmente ahora?</label><input class="input big num" id="aj-amt" inputmode="decimal" autocomplete="off" placeholder="0,00"></div>
    <div class="to-line" id="aj-diff" style="margin-top:12px"></div>
    <div class="field"><label for="aj-date">Fecha</label><input class="input" id="aj-date" type="date"></div>
    <div class="field"><label for="aj-note">Nota (opcional)</label><input class="input" id="aj-note" autocomplete="off" placeholder="Ej: ahorros que ya tenía" maxlength="60"></div>
    <div class="err" id="aj-err" role="alert"></div>
    <div style="display:grid;gap:10px;margin-top:6px">
      <button class="btn" data-act="aj-save">Guardar ajuste</button>
      <button class="btn danger" data-act="aj-del" id="aj-del" hidden>Eliminar ajuste</button>
    </div>
  </div>
</div>

<script>
(function () {
  var STANDALONE = true; /* true solo en la versión con hosting propio */
  var LS = "mis-gastos-v1";
  var COLORS = ["#ff7a1a", "#ffb454", "#f2c94c", "#a3e635", "#5bd694", "#4fd1a5", "#4cc9d8", "#5aa9ff", "#b48cff", "#ff6b81", "#ff8fb1", "#9a9189"];
  var DEF_ACC = [
    { id: "comida", n: "Comida", k: "e", c: "#ffb454" }, { id: "transporte", n: "Transporte", k: "e", c: "#5aa9ff" },
    { id: "hogar", n: "Hogar", k: "e", c: "#4fd1a5" }, { id: "salud", n: "Salud", k: "e", c: "#ff6b81" },
    { id: "ocio", n: "Ocio", k: "e", c: "#b48cff" }, { id: "compras", n: "Compras", k: "e", c: "#f2c94c" },
    { id: "servicios", n: "Servicios", k: "e", c: "#4cc9d8" }, { id: "otros", n: "Otros", k: "e", c: "#9a9189" },
    { id: "sueldo", n: "Sueldo", k: "i", c: "#5bd694" }, { id: "extra", n: "Ingreso extra", k: "i", c: "#a3e635" }
  ];
  var CURS = ["ARS", "USD", "EUR"];
  var DEF_WAL = [{ id: "efectivo", n: "Efectivo", c: "#5bd694" }, { id: "mp", n: "Mercado Pago", c: "#3ab4ff" }, { id: "ahorros", n: "Ahorros", c: "#b48cff" }];
  var lastW = "efectivo";
  function wal(id) { for (var i = 0; i < S.wal.length; i++) if (S.wal[i].id === id) return S.wal[i]; return S.wal[0]; }
  function otherWallet(id) { for (var i = 0; i < S.wal.length; i++) if (S.wal[i].id !== id) return S.wal[i].id; return S.wal[0].id; }
  var SYM = { ARS: "$", USD: "US$", EUR: "€" };
  var MONTHS = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
  var NF = new Intl.NumberFormat("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var pad = function (n) { return String(n).padStart(2, "0"); };
  var clone = function (x) { return JSON.parse(JSON.stringify(x)); };
  var uid = function () { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); };

  function todayStr() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function shift(key, n) { var p = key.split("-").map(Number); var d = new Date(p[0], p[1] - 1 + n, 1); return d.getFullYear() + "-" + pad(d.getMonth() + 1); }
  function monthName(key) { var p = key.split("-"); return MONTHS[+p[1] - 1] + " " + p[0]; }
  function fdate(s) { var p = s.split("-"); return p[2] + "/" + p[1]; }

  /* Datos de ejemplo, marcados como tales, para ver la app con contenido desde el primer momento. */
  function seed() {
    var now = new Date(), tx = [], n = 0;
    function add(off, day, t, a, c, k, note) {
      var d = new Date(now.getFullYear(), now.getMonth() + off, 1);
      var last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      var dd = Math.min(day, last);
      if (off === 0) dd = Math.min(dd, now.getDate());
      tx.push({ id: "ex" + (n++), t: t, a: a, c: c, k: k, w: (t === "i" || k === "servicios" || k === "compras") ? "mp" : "efectivo", n: note || "", d: d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(dd), ex: 1 });
    }
    add(0, 1, "i", 850000, "ARS", "sueldo", "Sueldo del mes");
    add(0, 4, "i", 60000, "ARS", "extra", "Trabajo aparte");
    add(0, 2, "e", 42300, "ARS", "comida", "Supermercado");
    add(0, 3, "e", 9800, "ARS", "transporte", "Carga de tarjeta");
    add(0, 5, "e", 38500, "ARS", "servicios", "Luz e internet");
    add(0, 8, "e", 15000, "ARS", "ocio", "Cine y salida");
    add(0, 10, "e", 25, "USD", "compras", "Suscripción");
    for (var m = 1; m <= 5; m++) {
      add(-m, 1, "i", 800000 + m * 6000, "ARS", "sueldo", "Sueldo");
      add(-m, 6, "e", 120000 + (m * 17000) % 90000, "ARS", "comida", "");
      add(-m, 12, "e", 60000 + (m * 9000) % 50000, "ARS", "servicios", "");
      add(-m, 18, "e", 25000 + (m * 12000) % 70000, "ARS", "ocio", "");
    }
    return { v: 2, tx: STANDALONE ? [] : tx, bud: STANDALONE ? {} : { comida: 120000, ocio: 40000, transporte: 30000 }, base: "ARS", rates: { ARS: 1, USD: 1200, EUR: 1300 }, ex: STANDALONE ? 0 : 1, updated: 0, acc: clone(DEF_ACC), wal: clone(DEF_WAL), accUpdated: 0 };
  }
  function goodImg(s) { return typeof s === "string" && s.indexOf("data:image/") === 0 && s.length < 60000; }
  function normAcc(list) {
    if (!Array.isArray(list) || !list.length) return clone(DEF_ACC);
    var out = [];
    list.forEach(function (a) {
      if (!a || !a.id || !a.n) return;
      var o = { id: String(a.id), n: String(a.n).slice(0, 24), k: a.k === "i" ? "i" : "e", c: /^#[0-9a-f]{6}$/i.test(a.c) ? a.c : "#9a9189" };
      if (goodImg(a.img)) o.img = a.img;
      if (typeof a.p === "string" && a.p) o.p = a.p;
      out.push(o);
    });
    out.forEach(function (o) {
      if (!o.p) return;
      var par = out.filter(function (x) { return x.id === o.p; })[0];
      if (!par || par.p || par.k !== o.k || par.id === o.id) delete o.p;
    });
    return out.length ? out : clone(DEF_ACC);
  }
  function normWal(list) {
    var out = [];
    (Array.isArray(list) ? list : []).forEach(function (a) {
      if (!a || !a.id || !a.n) return;
      var o = { id: String(a.id), n: String(a.n).slice(0, 24), c: /^#[0-9a-f]{6}$/i.test(a.c) ? a.c : "#9a9189" };
      if (goodImg(a.img)) o.img = a.img;
      if (!out.some(function (x) { return x.id === o.id; })) out.push(o);
    });
    return out.length ? out : clone(DEF_WAL);
  }
  function norm(d) {
    var s = clone(d || {});
    s.v = 2;
    s.tx = Array.isArray(s.tx) ? s.tx : [];
    s.wal = normWal(s.wal);
    var wids = s.wal.map(function (w) { return w.id; });
    s.tx.forEach(function (t) {
      if (wids.indexOf(t.w) < 0) t.w = wids[0];
      if (t.t === "t" && (wids.indexOf(t.w2) < 0 || t.w2 === t.w)) t.w2 = wids.filter(function (x) { return x !== t.w; })[0] || wids[0];
    });
    s.bud = s.bud && typeof s.bud === "object" ? s.bud : {};
    s.base = CURS.indexOf(s.base) >= 0 ? s.base : "ARS";
    s.rates = Object.assign({ ARS: 1, USD: 1200, EUR: 1300 }, s.rates || {}); s.rates.ARS = 1;
    s.ex = s.ex ? 1 : 0; s.updated = +s.updated || 0;
    s.acc = normAcc(s.acc); s.accUpdated = +s.accUpdated || 0;
    return s;
  }
  function loadLocal() { try { var r = localStorage.getItem(LS); if (r) return norm(JSON.parse(r)); } catch (e) {} return null; }

  var S = loadLocal() || seed();
  var tab = "home", month = todayStr().slice(0, 7), editBud = null, sync = "local";
  var form = null, af = null, retMove = false;

  /* Cuentas */
  function acc(id) {
    for (var i = 0; i < S.acc.length; i++) if (S.acc[i].id === id) return S.acc[i];
    return { id: id, n: "Sin categoría", k: "e", c: "#9a9189" };
  }
  function accOf(kind) { return S.acc.filter(function (a) { return a.k === kind; }); }
  function roots(kind) { return S.acc.filter(function (a) { return a.k === kind && !a.p; }); }
  function kids(id) { return S.acc.filter(function (a) { return a.p === id; }); }
  function root(a) { return a.p ? acc(a.p) : a; }
  function rootSpent(spent, id) { return kids(id).reduce(function (t, c) { return t + (spent[c.id] || 0); }, spent[id] || 0); }
  function av(a, cls) {
    return '<span class="av ' + (cls || "") + '" style="--c:' + a.c + '">' + (a.img ? '<img alt="" src="' + a.img + '">' : esc((a.n || "?").trim().charAt(0).toUpperCase())) + '</span>';
  }

  /* Guardado: siempre en este dispositivo; y en tu cuenta cuando está disponible. */
  var docs = null, saving = false, dirtyMain = false, dirtyAcc = false, timer = null;
  function mainBody() { return { v: 2, tx: clone(S.tx), bud: clone(S.bud), base: S.base, rates: clone(S.rates), ex: S.ex, updated: S.updated }; }
  function persist(which) {
    var now = Date.now();
    if (which === "acc") { S.accUpdated = now; dirtyAcc = true; } else { S.updated = now; dirtyMain = true; }
    try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}
    if (docs) { clearTimeout(timer); timer = setTimeout(flush, 600); }
  }
  async function flush() {
    if (saving || !docs) return;
    saving = true;
    var wm = false, wa = false;
    try {
      while (dirtyMain || dirtyAcc) {
        if (dirtyMain) { dirtyMain = false; wm = true; await docs.main.set(mainBody()); wm = false; }
        if (dirtyAcc) { dirtyAcc = false; wa = true; await docs.acc.set({ acc: clone(S.acc), wal: clone(S.wal), accUpdated: S.accUpdated }); wa = false; }
      }
      sync = "cloud";
    } catch (e) { sync = "local"; if (wm) dirtyMain = true; if (wa) dirtyAcc = true; }
    saving = false;
    if (tab === "settings") render();
  }
  async function connect() {
    try {
      var cl = window.claude; if (!cl || !cl.use) return;
      var got = await Promise.all([cl.use("user"), cl.use("db")]);
      var user = got[0], db = got[1]; if (!user || !db) return;
      var id = await user.id(); if (!id) return;
      var base = "data/users/" + id;
      var mref = db.doc(base + "/app"), aref = db.doc(base + "/accounts");
      var snaps = await Promise.all([mref.get(), aref.get()]);
      var ms = snaps[0], as = snaps[1];
      if (ms.exists) {
        var r = ms.data(), ru = +r.updated || 0;
        if (ru > S.updated) {
          S.tx = clone(r.tx || []); S.bud = clone(r.bud || {}); S.base = r.base; S.rates = clone(r.rates || {}); S.ex = r.ex ? 1 : 0; S.updated = ru;
        } else if (S.updated > ru) dirtyMain = true;
      } else if (S.updated > 0) dirtyMain = true;
      if (as.exists) {
        var q = as.data(), qu = +q.accUpdated || 0;
        if (qu > S.accUpdated && Array.isArray(q.acc) && q.acc.length) { S.acc = clone(q.acc); S.wal = clone(q.wal || []); S.accUpdated = qu; }
        else if (S.accUpdated > qu) dirtyAcc = true;
      } else if (S.accUpdated > 0) dirtyAcc = true;
      S = norm(S);
      try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}
      docs = { main: mref, acc: aref }; sync = "cloud";
      if (dirtyMain || dirtyAcc) flush();
      render();
    } catch (e) { /* sin sincronización: la app sigue funcionando en este dispositivo */ }
  }

  /* Cálculos */
  function toBase(t) { return t.a * (S.rates[t.c] || 1) / (S.rates[S.base] || 1); }
  function money(a, cur) { return SYM[cur] + " " + NF.format(a); }
  function inMonth(key) { return S.tx.filter(function (t) { return t.d.slice(0, 7) === key; }); }
  function totals(key) {
    var i = 0, e = 0;
    inMonth(key).forEach(function (t) { if (t.t === "t" || t.t === "a") return; var v = toBase(t); if (t.t === "i") i += v; else e += v; });
    return { i: i, e: e };
  }
  function walletBal(id) {
    var b = 0;
    S.tx.forEach(function (t) {
      var v = toBase(t), from = wal(t.w).id;
      if (t.t === "t") { if (from === id) b -= v; if (wal(t.w2).id === id) b += v; }
      else if (from === id) b += t.t === "a" ? v : t.t === "i" ? v : -v;
    });
    return b;
  }
  function walletDelta(id, key) {
    var b = 0;
    inMonth(key).forEach(function (t) {
      if (t.t === "a") return;
      var v = toBase(t), from = wal(t.w).id;
      if (t.t === "t") { if (from === id) b -= v; if (wal(t.w2).id === id) b += v; }
      else if (from === id) b += t.t === "a" ? v : t.t === "i" ? v : -v;
    });
    return b;
  }
  function byAcc(key) {
    var o = {};
    inMonth(key).forEach(function (t) { if (t.t === "e") o[t.k] = (o[t.k] || 0) + toBase(t); });
    return o;
  }

  /* Vistas */
  var IC = {
    up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
    down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>',
    prev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
    next: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
    chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>'
  };
  function monthBar() {
    return '<div class="month"><button data-act="prev" aria-label="Mes anterior">' + IC.prev + '</button><h1>' + monthName(month) + '</h1><button data-act="next" aria-label="Mes siguiente">' + IC.next + '</button></div>';
  }
  function exBanner() {
    return S.ex ? '<div class="note"><span>Estás viendo datos de ejemplo.</span><button class="link" data-act="clear-ex">Borrar ejemplos</button></div>' : "";
  }
  function byDate(a, b) { return a.d < b.d ? 1 : a.d > b.d ? -1 : (a.id < b.id ? 1 : -1); }
  function mvCard(t) {
    var a = acc(t.k), inc = t.t === "i";
    return '<button class="mv" data-act="edit" data-id="' + esc(t.id) + '"><div class="mv-top">' + av(a, "s") + '<b>' + esc(a.n) + '</b></div>' +
      '<div class="amt ' + (inc ? "pos" : "neg") + '">' + (inc ? "+" : "-") + money(t.a, t.c) + '</div>' +
      '<small><i class="dot" style="background:' + wal(t.w).c + '" title="' + wal(t.w).n + '"></i>' + (a.p ? esc(acc(a.p).n) + " · " : "") + fdate(t.d) + (t.n ? " · " + esc(t.n) : "") + '</small></button>';
  }
  function adjRow(t) {
    var w = wal(t.w);
    return '<button class="row" data-act="edit" data-id="' + esc(t.id) + '"><span class="rmain"><b><i class="dot" style="background:' + w.c + '"></i> ' + (w.id === "ahorros" ? "Ahorros" : w.n) + '</b><small>' + fdate(t.d) + ' · ' + esc(t.n || "Ajuste de saldo") + '</small></span><span class="amt">' + (t.a < 0 ? "-" : "+") + money(Math.abs(t.a), t.c) + '</span></button>';
  }
  function trRow(t) {
    var a = wal(t.w), b = wal(t.w2);
    return '<button class="row" data-act="edit" data-id="' + esc(t.id) + '"><span class="rmain"><b><i class="dot" style="background:' + a.c + '"></i> ' + a.n + ' → <i class="dot" style="background:' + b.c + '"></i> ' + b.n + '</b><small>' + fdate(t.d) + (t.n ? " · " + esc(t.n) : "") + '</small></span><span class="amt">' + money(t.a, t.c) + '</span></button>';
  }
  function col(kind, items) {
    var inc = kind === "i";
    var h = '<section><div class="colh ' + (inc ? "pos" : "neg") + '">' + (inc ? IC.up : IC.down) + (inc ? "Ingresos" : "Gastos") + '<span>' + items.length + '</span></div>';
    h += items.length ? '<div class="list">' + items.map(mvCard).join("") + '</div>' : '<div class="mini-empty">' + (inc ? "Sin ingresos este mes" : "Sin gastos este mes") + '</div>';
    return h + '</section>';
  }

  /* Ojo: oculta el balance del mes y los saldos de las cuentas. Se recuerda en este dispositivo. */
  var MASK = "\u2022\u2022\u2022\u2022\u2022\u2022";
  var HIDE = false;
  try { HIDE = localStorage.getItem("orbita-hide") === "1"; } catch (e) {}
  function eyeBtn() {
    var open = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
    var shut = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 6.2A9.7 9.7 0 0 1 12 6c6.4 0 10 6 10 6a17 17 0 0 1-3.2 3.9M6.1 7.5C3.6 9.2 2 12 2 12s3.6 6 10 6c1.6 0 3-.4 4.3-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
    return '<button class="eye" data-act="eye" aria-pressed="' + HIDE + '" aria-label="' + (HIDE ? "Mostrar cifras" : "Ocultar cifras") + '">' + (HIDE ? shut : open) + '</button>';
  }
  function vHome() {

  function vBudgets() {
    var spent = byAcc(month);
    var h = monthBar() + '<p class="hint">Límites mensuales en ' + S.base + '. Tocá una categoría de gastos para definir o cambiar su límite.</p>';
    roots("e").forEach(function (c) {
      var lim = S.bud[c.id] || 0, used = rootSpent(spent, c.id), r = lim ? used / lim : 0;
      var color = r >= 1 ? "var(--neg)" : r >= 0.8 ? "var(--warn)" : c.c;
      h += '<div class="card"><button style="width:100%" data-act="bud" data-id="' + esc(c.id) + '"><div class="card-top"><b>' + av(c, "s") + '<span style="color:var(--fg);font-size:15px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(c.n) + '</span></b><span class="num">' + money(used, S.base) + (lim ? " / " + money(lim, S.base) : "") + '</span></div>';
      if (lim) {
        h += '<div class="bar"><i style="width:' + Math.min(100, r * 100).toFixed(1) + '%;background:' + color + '"></i></div>';
        h += '<div class="sub num' + (r >= 1 ? " bad" : "") + '">' + (r >= 1 ? "Te pasaste por " + money(used - lim, S.base) : "Te quedan " + money(lim - used, S.base)) + '</div>';
      } else h += '<div class="sub">Sin presupuesto definido</div>';
      h += '</button>';
      if (editBud === c.id) {
        h += '<div class="edit"><input class="input num" id="bud-in" inputmode="decimal" placeholder="Límite mensual" value="' + (lim ? toInputStr(lim) : "") + '" aria-label="Límite mensual de ' + esc(c.n) + '"><button class="btn small" data-act="bud-save" data-id="' + esc(c.id) + '">Guardar</button></div>';
        if (lim) h += '<button class="link" data-act="bud-del" data-id="' + esc(c.id) + '" style="margin-top:6px">Quitar presupuesto</button>';
      }
      h += '</div>';
    });
    return h;
  }

  function vSummary() {

      g.v += cats[id]; tot += cats[id];
      if (a.p) g.sub.push({ a: a, v: cats[id] }); else g.own += cats[id];

  function toInputStr(n) {
    var parts = String(n).split(".");
    return parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".") + (parts[1] ? "," + parts[1].slice(0, 2) : "");
  }
  /* Da formato mientras se escribe: 1.000.000,50 (punto de miles, coma decimal). */
  function fmtInput(el) {
    var v = el.value, pos = el.selectionStart == null ? v.length : el.selectionStart;
    if (/\.$/.test(v) && v.indexOf(",") < 0) v = v.slice(0, -1) + ",";
    var sig = 0, i;
    for (i = 0; i < Math.min(pos, v.length); i++) if (/[\d,]/.test(v.charAt(i))) sig++;
    var clean = v.replace(/[^\d,]/g, ""), ci = clean.indexOf(",");
    var ip = ci < 0 ? clean : clean.slice(0, ci);
    var dp = ci < 0 ? "" : clean.slice(ci + 1).replace(/,/g, "").slice(0, 2);
    ip = ip.replace(/^0+(?=\d)/, "");
    if (ip === "" && ci >= 0) ip = "0";
    var out = ip.replace(/\B(?=(\d{3})+(?!\d))/g, ".") + (ci < 0 ? "" : "," + dp);
    el.value = out;
    var n = 0, p = 0;
    while (p < out.length && n < sig) { if (/[\d,]/.test(out.charAt(p))) n++; p++; }
    try { el.setSelectionRange(p, p); } catch (e) {}
  }

    return parseFloat(s);
  }

    try {
      var file = new File([json], name, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: "Copia de Órbita" });
        if (msg) msg.textContent = "Copia lista.";
        return;
      }
    } catch (e) { if (e && e.name === "AbortError") return; }
    try {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([json], { type: "application/json" }));
      a.download = name; document.body.appendChild(a); a.click(); a.remove();
      if (msg) msg.textContent = "Copia descargada.";
    } catch (e) { if (msg) msg.textContent = "No pude guardar la copia en este dispositivo."; }
  }
  function readBackup(file) {
    var msg = $("#bk-msg"), r = new FileReader();
    r.onload = function () {
      try {
        var o = JSON.parse(String(r.result)), d = o && o.data ? o.data : o;
        if (!d || !Array.isArray(d.tx)) throw new Error("formato");
        pendingBackup = norm(d);
        msg.innerHTML = "La copia tiene " + pendingBackup.tx.length + " movimientos. Restaurarla reemplaza lo que hay ahora. " + '<button class="link" data-act="bk-confirm">Restaurar</button>';
      } catch (e) { pendingBackup = null; msg.textContent = "Ese archivo no parece una copia de Órbita."; }
    };
    r.onerror = function () { msg.textContent = "No pude leer ese archivo."; };
    r.readAsText(file);
  }

  /* Eventos */
  document.addEventListener("click", function (e) {
    var t = e.target;
    if (t.classList && t.classList.contains("scrim")) {
      if (t.id === "scrim-acc") closeAcc(); else if (t.id === "scrim") closeSheet(); else t.hidden = true;
      return;
    }
    var el = t.closest("[data-act]");
    if (!el) return;
    var act = el.getAttribute("data-act"), id = el.getAttribute("data-id"), val = el.getAttribute("data-v");
    if (act === "tab") { tab = el.getAttribute("data-tab"); editBud = null; render(); window.scrollTo(0, 0); }
    else if (act === "add") $("#scrim-menu").hidden = false;
    else if (act === "close-menu") $("#scrim-menu").hidden = true;
    else if (act === "menu-e") { $("#scrim-menu").hidden = true; openSheet(null, "e"); }
    else if (act === "menu-i") { $("#scrim-menu").hidden = true; openSheet(null, "i"); }
    else if (act === "menu-t") { $("#scrim-menu").hidden = true; openSheet(null, "t"); }
    else if (act === "menu-wal") { $("#scrim-menu").hidden = true; openWal(null); }
    else if (act === "menu-acc") { $("#scrim-menu").hidden = true; openAcc(null, "e", false); }
    else if (act === "edit") openSheet(id);
    else if (act === "close") closeSheet();
    else if (act === "save") saveForm();
    else if (act === "del") {
      if (el.getAttribute("data-armed")) {
        S.tx = S.tx.filter(function (x) { return x.id !== form.id; });
        persist(); closeSheet(); render();
      } else { el.setAttribute("data-armed", "1"); el.textContent = "Tocá de nuevo para eliminar"; }
    }
    else if (act === "ftype") { form.t = val; form.k = firstAcc(val); paintSheet(); }
    else if (act === "fcur") { form.c = val; paintSheet(); }
    else if (act === "fcat") { form.k = val; paintSheet(); }
    else if (act === "fwal") { form.w = val; paintSheet(); }
    else if (act === "fto") { form.w2 = val; paintSheet(); }
    else if (act === "fsub") { form.k = form.k === val ? root(acc(val)).id : val; paintSheet(); }
    else if (act === "newsub") openAcc(null, form.t, true, form.k ? root(acc(form.k)).id : null);
    else if (act === "newacc") openAcc(null, form.t, true);
    else if (act === "editacc") openAcc(id, null, false);
    else if (act === "editwal") openWal(id);
    else if (act === "close-acc") closeAcc();
    else if (act === "ac-save") saveAcc();
    else if (act === "ac-del") {
      if (el.getAttribute("data-armed")) delAcc();
      else {
        var nu = af && af.wl ? walUsed(af.id) : 0;
        el.setAttribute("data-armed", "1");
        el.textContent = "Tocá de nuevo para eliminar";
        $("#ac-err").textContent = nu ? "Se borra la cuenta junto con sus " + nu + " movimiento" + (nu === 1 ? "" : "s") + ". No se puede deshacer." : "";
      }
    }
    else if (act === "akind") { af.k = val; af.p = null; paintAcc(); }
    else if (act === "apar") { af.p = val || null; paintAcc(); }
    else if (act === "acol") { af.c = val; paintAcc(); }
    else if (act === "ac-nophoto") { af.img = null; $("#ac-file").value = ""; paintAcc(); }
    else if (act === "bk-export") exportBackup();
    else if (act === "bk-confirm") { if (pendingBackup) { S = pendingBackup; pendingBackup = null; persist(); persist("acc"); render(); } }
    else if (act === "adj") openAdj(el.getAttribute("data-w"), null);
    else if (act === "close-adj") closeAdj();
    else if (act === "aj-save") saveAdj();
    else if (act === "aj-del") {
      if (el.getAttribute("data-armed")) { var aid = aj.id; S.tx = S.tx.filter(function (x) { return x.id !== aid; }); persist(); closeAdj(); render(); }
      else { el.setAttribute("data-armed", "1"); el.textContent = "Tocá de nuevo para eliminar"; }
    }
    else if (act === "eye") { HIDE = !HIDE; try { localStorage.setItem("orbita-hide", HIDE ? "1" : "0"); } catch (err) {} render(); }
    else if (act === "prev") { month = shift(month, -1); render(); }
    else if (act === "next") { month = shift(month, 1); render(); }
    else if (act === "bud") { editBud = editBud === id ? null : id; render(); }
    else if (act === "bud-save") {
      var v = parseAmt($("#bud-in").value);
      if (v > 0) S.bud[id] = v; else delete S.bud[id];
      editBud = null; persist(); render();
    }
    else if (act === "bud-del") { delete S.bud[id]; editBud = null; persist(); render(); }
    else if (act === "base") { S.base = el.getAttribute("data-c"); persist(); render(); }
    else if (act === "clear-ex") {
      S.tx = S.tx.filter(function (x) { return !x.ex; }); S.bud = {}; S.ex = 0; persist(); render();
    }
  });
  document.addEventListener("change", function (e) {
    var tg = e.target;
    if (tg.id === "bk-file") { var bf = tg.files && tg.files[0]; if (bf) readBackup(bf); tg.value = ""; return; }
    if (tg.id === "ac-file") {
      var f = tg.files && tg.files[0]; if (!f) return;
      $("#ac-err").textContent = "";
      toThumb(f).then(function (u) { if (af) { af.img = u; paintAcc(); } })
        .catch(function () { $("#ac-err").textContent = "No pude leer esa imagen. Probá con otra foto."; });
      return;
    }
    var c = tg.getAttribute && tg.getAttribute("data-rate");
    if (!c) return;
    var v = parseAmt(tg.value);
    if (v > 0) { S.rates[c] = v; persist(); }
    render();
  });
  document.addEventListener("input", function (e) {
    var id = e.target.id;
    if (id === "ac-name" && af) paintAcc();
    else if (id === "sh-amt" || id === "bud-in" || id === "ac-bal") fmtInput(e.target);
    else if (id === "aj-amt") { fmtInput(e.target); paintAdjDiff(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      if (!$("#scrim-adj").hidden) closeAdj(); else if (!$("#scrim-acc").hidden) closeAcc(); else if (!$("#scrim").hidden) closeSheet(); else $("#scrim-menu").hidden = true;
    }
    if (e.key === "Enter" && e.target.id === "bud-in") { var b = document.querySelector('[data-act="bud-save"]'); if (b) b.click(); }
  });

  if (STANDALONE && "serviceWorker" in navigator) window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  /* Sin zoom: Safari ignora user-scalable=no, así que se frenan también los gestos de pellizco. */
  try {
    document.querySelectorAll('meta[name="viewport"]').forEach(function (m) {
      m.setAttribute("content", "width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover");
    });
  } catch (e) {}
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (n) {
    document.addEventListener(n, function (e) { e.preventDefault(); }, { passive: false });
  });
  document.addEventListener("touchmove", function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });

  render();
  connect();
})();
</script>

</body></html>
